[package]
name = "voltik-python"
# the Python package has its own version, published by py-v* tags (.github/workflows/pypi.yml)
version = "0.15.0"
description = "Python bindings of voltik: TikZ figures to SVG and PNG"
edition.workspace = true
license.workspace = true
publish = false

[lib]
# the module name imported in Python (`import voltik`) comes from pyproject.toml
name = "voltik_python"
crate-type = ["cdylib"]

[dependencies]
voltik.workspace = true
pyo3 = { version = "0.25", features = ["extension-module", "abi3-py39"] }
